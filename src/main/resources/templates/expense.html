<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Major Expenses</title>
    <link rel="stylesheet" th:href="@{/css/expense.css}" />
</head>
<body>
<main th:fragment="content">
    <div class="card mb-4">
        <div class="card-header">
            Major Expenses Summary
        </div>
        <div class="card-body">
            <h5 class="card-title">Total Major Expenses</h5>
            <p class="card-text" th:text="'- ₹ ' + ${#numbers.formatDecimal(totalExpenses, 0, 'COMMA', 0, 'POINT')}"></p>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header">
            Major Expenses History
        </div>
        <div class="card-body">
            <div th:if="${expenses.empty}" class="no-entries">
                <p>No major expense entries yet.</p>
            </div>
            <div th:unless="${expenses.empty}" class="table-responsive">
                <table class="table table-striped table-hover mb-3">
                    <thead>
                    <tr>
                        <th class="col-expense-description">Description</th>
                        <th class="col-date">Date</th>
                        <th class="col-amount">Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td class="col-expense-description" th:text="${expense.description}"></td>
                        <td class="col-date" th:text="${#temporals.format(expense.date, 'dd-MM-yyyy')}"></td>
                        <td class="col-amount expense-amount" th:text="'- ₹ ' + ${#numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
