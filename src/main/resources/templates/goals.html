<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Goals</title>
    <link rel="stylesheet" th:href="@{/css/goals.css}" />
</head>
<body>
    <main th:fragment="content">
        <div class="card mb-4 card-short-term-goals">
            <div class="card-header">
                Short-Term Goals
            </div>
            <div class="card-body">
                <div th:if="${shortTermGoals.empty}" class="no-goals">
                    <p>No short-term goals defined yet.</p>
                </div>
                <div th:unless="${shortTermGoals.empty}" class="table-responsive">
                    <table class="table table-striped table-hover mb-3">
                        <thead>
                            <tr>
                                <th class="col-goal-description">Goal Description</th>
                                <th class="col-status">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="goal : ${shortTermGoals}">
                                <td class="col-goal-description" th:text="${goal.description}"></td>
                                <td class="col-status">
                                    <span th:class="${goal.status.toLowerCase() == 'completed' ? 'status-completed' : (goal.status.toLowerCase() == 'in progress' ? 'status-in-progress' : (goal.status.toLowerCase() == 'planned' ? 'status-planned' : 'status-default'))}"
                                          th:text="${goal.status.toLowerCase() == 'completed' ? 'Completed' : (goal.status.toLowerCase() == 'in progress' ? 'In Progress' : (#strings.capitalize(goal.status.toLowerCase())))}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted">
            </div>
        </div>
        <div class="card mb-4 card-long-term-goals">
            <div class="card-header">
                Long-Term Goals
            </div>
            <div class="card-body">
                <div th:if="${longTermGoals.empty}" class="no-goals">
                    <p>No long-term goals defined yet.</p>
                </div>
                <div th:unless="${longTermGoals.empty}" class="table-responsive">
                    <table class="table table-striped table-hover mb-3">
                        <thead>
                            <tr>
                                <th class="col-goal-description">Goal Description</th>
                                <th class="col-status">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="goal : ${longTermGoals}">
                                <td class="col-goal-description" th:text="${goal.description}"></td>
                                <td class="col-status">
                                    <span th:class="${goal.status.toLowerCase() == 'completed' ? 'status-completed' : (goal.status.toLowerCase() == 'in progress' ? 'status-in-progress' : (goal.status.toLowerCase() == 'planned' ? 'status-planned' : 'status-default'))}"
                                          th:text="${goal.status.toLowerCase() == 'completed' ? 'Completed' : (goal.status.toLowerCase() == 'in progress' ? 'In Progress' : (#strings.capitalize(goal.status.toLowerCase())))}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted">
            </div>
        </div>
</body>
</html>
