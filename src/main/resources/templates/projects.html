<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Projects</title>
    <link rel="stylesheet" th:href="@{/css/projects.css}" />
</head>
<body>
    <main th:fragment="content">
        <div class="card">
            <div class="card-header">
                My Projects
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th class="white-space-nowrap">S.No.</th>
                            <th>Project Name</th>
                            <th class="white-space-nowrap col-start-date">Start Date</th>
                            <th class="white-space-nowrap col-end-date">End Date</th>
                            <th class="white-space-nowrap">Company Name</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="project, projectStat : ${projects}">
                            <td class="sno-bold white-space-nowrap" th:text="${projectStat.index + 1} + '.'"></td>
                            <td class="project-title-bold" th:text="${project.name}"></td>
                            <td class="white-space-nowrap col-start-date" th:text="${project.formattedStartDate}"></td>
                            <td class="white-space-nowrap col-end-date" th:text="${project.formattedEndDate}"
                                th:classappend="${project.isCurrent() or project.isEndDateCurrentDay()} ? 'current-date-bold' : ''"></td>
                            <td class="white-space-nowrap" th:text="${project.companyName}"
                                th:classappend="${project.shouldHighlightCompanyName} ? 'highlight-company' : ''"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted">
                <h5 class="projects-total-count" th:text="'Total Projects: ' + ${totalProjects}"></h5>
            </div>
        </div>
    </main>
</body>
</html>
