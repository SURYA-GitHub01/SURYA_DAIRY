<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Emergency Fund</title>
    <link rel="stylesheet" th:href="@{/css/emergency-fund.css}" />
</head>
<body>
<main th:fragment="content">
    <div class="card mb-4">
        <div class="card-header">
            Emergency Fund Summary
        </div>
        <div class="card-body">
            <h5 class="card-title">Total Emergency Fund</h5>
            <p class="card-text" th:text="${'₹ ' + #numbers.formatDecimal(totalEmergencyFund, 0, 'COMMA', 0, 'POINT')}"></p>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header">
            Emergency Fund History
        </div>
        <div class="card-body">
            <div th:if="${emergencyFundList.empty}" class="no-entries">
                <p>No emergency fund entries yet.</p>
            </div>
            <div th:unless="${emergencyFundList.empty}" class="table-responsive">
                <table class="table table-striped table-hover mb-3">
                    <thead>
                    <tr>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fund : ${emergencyFundList}">
                        <td th:text="${fund.description}"></td>
                        <td th:text="${#temporals.format(fund.date, 'dd-MM-yyyy')}"></td>
                        <td class="emergency-fund-amount" th:text="${'₹ ' + #numbers.formatDecimal(fund.amount, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
