<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Surya's Diary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
    <h3 class="main-title">Surya's Diary</h3>
    <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/' ? 'active' : ''}" href="/"><i class="fas fa-home"></i> &nbsp; Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/transactions' ? 'active' : ''}" href="/transactions"><i class="fas fa-exchange-alt"></i> &nbsp; Transactions</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/accounts' ? 'active' : ''}" href="/accounts"><i class="fas fa-wallet"></i> &nbsp; Accounts</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/salary' ? 'active' : ''}" href="/salary"><i class="fas fa-money-bill-wave"></i> &nbsp; Salary</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/investments' ? 'active' : ''}" href="/investments"><i class="fas fa-chart-line"></i> &nbsp; Investments</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/gold-silver' ? 'active' : ''}" href="/gold-silver"><i class="fas fa-coins"></i> &nbsp; Gold & Silver</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/rd' ? 'active' : ''}" href="/rd"><i class="fas fa-piggy-bank"></i> &nbsp; RD</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/credit-cards' ? 'active' : ''}" href="/credit-cards"><i class="fas fa-credit-card"></i> &nbsp; Credit Cards</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/loans' ? 'active' : ''}" href="/loans"><i class="fas fa-hand-holding-usd"></i> &nbsp; Loans</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/services' ? 'active' : ''}" href="/services"><i class="fas fa-concierge-bell"></i> &nbsp; Services</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/my-privileges' ? 'active' : ''}" href="/my-privileges"><i class="fas fa-user-shield"></i> &nbsp; My Privileges</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${requestURI == '/settings' ? 'active' : ''}" href="/settings"><i class="fas fa-cog"></i> &nbsp; Setting</a></li>
    </ul>
</div>

<div class="main-content">
    <div th:insert="~{__${view}__ :: content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
