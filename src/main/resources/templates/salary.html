<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Salary</title>
    <link rel="stylesheet" th:href="@{/css/salary.css}" />
</head>
<body>
    <main th:fragment="content">
        <div class="card">
            <div class="card-header">
                Salary Overview
            </div>
            <div class="card-body">
                <div th:each="entry : ${groupedSalaries}" class="mb-4">
                    <h5 class="mt-4 mb-2" th:text="${entry.key}">Company Name</h5>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-3">
                            <thead>
                            <tr>
                                <th class="white-space-nowrap">S.No.</th>
                                <th class="white-space-nowrap">Month</th>
                                <th class="white-space-nowrap">Year</th>
                                <th class="white-space-nowrap">Total Salary</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="salary, salaryStat : ${entry.value}">
                                <td class="sno-bold white-space-nowrap" th:text="${salaryStat.index + 1} + '.'"></td>
                                <td class="white-space-nowrap" th:text="${salary.month}"
                                    th:classappend="${salary.isJanuary} ? 'january-highlight' : ''"></td>
                                <td class="white-space-nowrap" th:text="${salary.year}"
                                    th:classappend="(${salary.shouldHighlightYear} ? 'highlight-year' : '') + (${salary.isJanuary} ? ' january-highlight' : '')"></td>
                                <td class="white-space-nowrap" th:text="${salary.formattedTotalSalary}"
                                    th:class="${salary.isAmountIncreased} ? 'amount-increased salary-amount-default' : 'salary-amount-default'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
            <div class="card-footer text-muted">
                Last updated: <span th:text="${#dates.format(#dates.createNow(), 'MMMM dd, yyyy')}">January 01, 2026</span>
            </div>
        </div>
    </main>
</body>
</html>
