<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Savings Tracker</title>
    <link rel="stylesheet" th:href="@{/css/savings.css}" />
</head>
<body>
<main th:fragment="content">
    <div class="card mb-4">
        <div class="card-header">
            Savings Summary
        </div>
        <div class="card-body">
            <h5 class="card-title">Total Savings</h5>
            <p class="card-text" th:text="${'₹' + #numbers.formatDecimal(totalSavings, 0, 0)}"></p>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header">
            Savings History
        </div>
        <div class="card-body">
            <div th:if="${savingsList.empty}" class="no-entries">
                <p>No savings entries yet.</p>
            </div>
            <div th:unless="${savingsList.empty}" class="table-responsive">
                <table class="table table-striped table-hover mb-3">
                    <thead>
                    <tr>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="savings : ${savingsList}">
                        <td th:text="${savings.description}"></td>
                        <td th:text="${#temporals.format(savings.date, 'dd-MM-yyyy')}"></td>
                        <td class="savings-amount" th:text="${'₹' + #numbers.formatDecimal(savings.amount, 0, 0)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
