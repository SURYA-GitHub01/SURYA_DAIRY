<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Accounts</title>
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
</head>
<body>
<main th:fragment="content">
    <div class="header">
        <h1>Accounts</h1>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title">Total Savings</h5>
                </div>
                <div class="card-body">
                    <h3 class="fw-bold text-success" th:text="'₹ ' + ${#numbers.formatDecimal(totalSavings, 0, 'COMMA', 0, 'POINT')}"></h3>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title">Total Emergency Fund</h5>
                </div>
                <div class="card-body">
                    <h3 class="fw-bold text-warning" th:text="'₹ ' + ${#numbers.formatDecimal(totalEmergencyFund, 0, 'COMMA', 0, 'POINT')}"></h3>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title">Grand Total</h5>
                </div>
                <div class="card-body">
                    <h3 class="fw-bold grand-total-amount" style="color: darkorange !important;" th:text="'₹ ' + ${#numbers.formatDecimal(grandTotal, 0, 'COMMA', 0, 'POINT')}"></h3>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Savings History</h5>
                </div>
                <div class="card-body">
                    <div th:if="${savingsList.empty}" class="no-entries">
                        <p>No savings entries yet.</p>
                    </div>
                    <div th:unless="${savingsList.empty}" class="table-responsive">
                        <table class="table table-dark table-striped table-hover">
                            <thead>
                            <tr>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Amount</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="savings : ${savingsList}">
                                <td th:text="${savings.description}"></td>
                                <td th:text="${#temporals.format(savings.savingsDate, 'dd-MM-yyyy')}"></td>
                                <td class="savings-amount text-success" th:text="'₹ ' + ${#numbers.formatDecimal(savings.amount, 0, 'COMMA', 0, 'POINT')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-12">
            <div class="card mt-4">
                <div class="card-header">
                    <h5 class="card-title">Emergency Fund History</h5>
                </div>
                <div class="card-body">
                    <div th:if="${emergencyFundList.empty}" class="no-entries">
                        <p>No emergency fund entries yet.</p>
                    </div>
                    <div th:unless="${emergencyFundList.empty}" class="table-responsive">
                        <table class="table table-dark table-striped table-hover">
                            <thead>
                            <tr>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Amount</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="fund : ${emergencyFundList}">
                                <td th:text="${fund.description}"></td>
                                <td th:text="${#temporals.format(fund.fundDate, 'dd-MM-yyyy')}"></td>
                                <td class="emergency-fund-amount text-warning" th:text="'₹ ' + ${#numbers.formatDecimal(fund.amount, 0, 'COMMA', 0, 'POINT')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
