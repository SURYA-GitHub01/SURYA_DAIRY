<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Investments</title>
</head>
<body>
<main th:fragment="content">
    <div class="header">
        <h1>Investments</h1>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5 class="card-title">Short-Term Goals</h5>
        </div>
        <div class="card-body">
            <div th:if="${shortTermGoals.empty}" class="no-goals">
                <p>No short-term goals defined yet.</p>
            </div>
            <div th:unless="${shortTermGoals.empty}" class="table-responsive">
                <table class="table table-dark table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Goal Description</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="goal : ${shortTermGoals}">
                        <td th:text="${goal.description}"></td>
                        <td>
                            <span th:class="${goal.status.toLowerCase() == 'completed' ? 'badge bg-success' : (goal.status.toLowerCase() == 'in progress' ? 'badge bg-warning text-dark' : 'badge bg-info text-dark')}"
                                  th:text="${#strings.capitalize(goal.status)}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="card-title">Long-Term Goals</h5>
        </div>
        <div class="card-body">
            <div th:if="${longTermGoals.empty}" class="no-goals">
                <p>No long-term goals defined yet.</p>
            </div>
            <div th:unless="${longTermGoals.empty}" class="table-responsive">
                <table class="table table-dark table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Goal Description</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="goal : ${longTermGoals}">
                        <td th:text="${goal.description}"></td>
                        <td>
                            <span th:class="${goal.status.toLowerCase() == 'completed' ? 'badge bg-success' : (goal.status.toLowerCase() == 'in progress' ? 'badge bg-warning text-dark' : 'badge bg-info text-dark')}"
                                  th:text="${#strings.capitalize(goal.status)}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
