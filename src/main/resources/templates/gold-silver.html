<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gold & Silver</title>
    <link rel="stylesheet" th:href="@{/css/gold-silver.css}">
</head>
<body>
<main th:fragment="content">
    <div class="header d-flex justify-content-between align-items-center mb-4">
        <h1>Gold & Silver</h1>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card gold-card h-100">
                <div class="card-body p-4 text-center">
                    <h6 class="card-subtitle mb-3 text-muted text-uppercase small fw-bold">Total Gold</h6>
                    <h2 class="card-title mb-0 fw-bold" style="font-size: 3rem !important; color: #FFD700 !important;" th:text="${totalGoldWeight.intValue()} + ' g'">0 g</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card silver-card h-100">
                <div class="card-body p-4 text-center">
                    <h6 class="card-subtitle mb-3 text-muted text-uppercase small fw-bold">Total Silver</h6>
                    <h2 class="card-title mb-0 fw-bold" style="font-size: 3rem !important; color: #C0C0C0 !important;" th:text="${totalSilverWeight.intValue()} + ' g'">0 g</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Gold Buying History</h5>
                    <span class="badge" style="background-color: #2b2100; color: #FFD700; border: 1px solid #FFD700; padding: 6px 12px; font-weight: bold; font-size: 0.85rem;">Gold</span>
                </div>
                <div class="card-body">
                    <div th:if="${goldEntries.empty}" class="text-center py-3">
                        <p class="text-muted mb-0">No gold purchase history found.</p>
                    </div>
                    <div th:unless="${goldEntries.empty}" class="table-responsive">
                        <table class="table table-dark table-striped table-hover mb-0">
                            <thead>
                            <tr>
                                <th style="width: 33.33%">Date</th>
                                <th style="width: 33.33%">Weight (g)</th>
                                <th style="width: 33.33%">Price Paid</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${goldEntries}">
                                <td th:text="${entry.date}"></td>
                                <td class="fw-bold" style="color: #FFD700 !important;" th:text="${entry.weight} + ' g'"></td>
                                <td th:text="${entry.formattedPrice}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Silver Buying History</h5>
                    <span class="badge" style="background-color: #2a2a2a; color: #C0C0C0; border: 1px solid #C0C0C0; padding: 6px 12px; font-weight: bold; font-size: 0.85rem;">Silver</span>
                </div>
                <div class="card-body">
                    <div th:if="${silverEntries.empty}" class="text-center py-3">
                        <p class="text-muted mb-0">No silver purchase history found.</p>
                    </div>
                    <div th:unless="${silverEntries.empty}" class="table-responsive">
                        <table class="table table-dark table-striped table-hover mb-0">
                            <thead>
                            <tr>
                                <th style="width: 33.33%">Date</th>
                                <th style="width: 33.33%">Weight (g)</th>
                                <th style="width: 33.33%">Price Paid</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${silverEntries}">
                                <td th:text="${entry.date}"></td>
                                <td class="fw-bold" style="color: #C0C0C0 !important;" th:text="${entry.weight} + ' g'"></td>
                                <td th:text="${entry.formattedPrice}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
