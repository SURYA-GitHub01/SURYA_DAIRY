<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::head}, ~{::main})}">
<head>
    <title>Transactions</title>
    <link rel="stylesheet" th:href="@{/css/transactions.css}">
</head>
<body>
<main th:fragment="content">
    <div class="header">
        <h1>Transactions</h1>
    </div>

    <div class="row g-4">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title">Total Major Expenses</h5>
                </div>
                <div class="card-body">
                    <h3 class="fw-bold text-danger" th:text="'- ₹ ' + ${#numbers.formatDecimal(totalExpenses, 0, 'COMMA', 0, 'POINT')}"></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Transaction History</h5>
                </div>
                <div class="card-body">
                    <div th:if="${expenses.empty}" class="no-entries">
                        <p>No major expense entries yet.</p>
                    </div>
                    <div th:unless="${expenses.empty}" class="table-responsive">
                        <table class="table table-dark table-striped table-hover">
                            <thead>
                            <tr>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Amount</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="expense : ${expenses}">
                                <td th:text="${expense.description}"></td>
                                <td th:text="${#temporals.format(expense.date, 'dd-MM-yyyy')}"></td>
                                <td class="expense-amount text-danger" th:text="'- ₹ ' + ${#numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div></main>
</body>
</html>
